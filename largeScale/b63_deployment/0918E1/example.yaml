id: b63-0918e1-star-smoke
name: Parameterized Star Saturation Topology
description: Two ASes from the 0918E1 star generator, each with one border-to-peer iperf pair and IX100 RS peering.
runner: internet
script: createStarTopology.py
platform: amd
features:
  - ipv4-default
  - ebgp-route-server
  - ibgp
  - ospf
  - iperf3

compile:
  enabled: true
  command: [python3, createStarTopology.py, "2", --output-dir, output-smoke]
  standard_args: false
  output: output-smoke
  clean: [output-smoke]
  expected:
    - output-smoke/docker-compose.yml
    - output-smoke/topology.json
  timeout: 300

build:
  enabled: true
  timeout: 1800

runtime:
  compose: output-smoke/docker-compose.yml
  readiness:
    - name: route server and four routers are running
      type: compose-ps
      services:
        - rs_ix_ix100
        - brdnode_64512_border
        - rnode_64512_peer
        - brdnode_64513_border
        - rnode_64513_peer
      retries: 30
      interval: 2

probes:
  - name: AS64512 direct pair is reachable
    type: ping
    service: brdnode_64512_border
    target: 172.16.0.3
    count: 3
    retries: 20
    interval: 2
  - name: AS64513 iperf server accepts a short test
    type: exec
    service: brdnode_64513_border
    command: iperf3 -c 172.16.1.3 -t 1 -J >/tmp/smoke-iperf.json
    expect_exit: 0
    retries: 20
    interval: 2

