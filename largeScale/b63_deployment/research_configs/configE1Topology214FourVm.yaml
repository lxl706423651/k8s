kind: kvm
clusterName: seedemu-b63-e1-214
experiment:
  topologySize: 214
  topologyDir: /data/lxl/seed-emulator/topology
  canonicalOutputDir: /data/lxl/seed-emulator/topology/output_214_exportAll
  name: b63-e1-214
  namespace: seedemu-b63-e1-214
ssh:
  user: ubuntu
  key: /home/lxl/.ssh/id_ed25519
defaults:
  masterName: b63-e1-master
  workerNamePrefix: b63-e1-worker
  ipPrefix: 10.86.0
  masterIpStart: 10
  workerIpStart: 11
  macPrefix: 52:54:00:63:86
  masterMacStart: 16
  workerMacStart: 17
master: {vcpus: 4, memoryGiB: 8, diskGb: 32}
workers: {count: 3, vcpus: 4, memoryGiB: 8, diskGb: 32}
kvm:
  prepareImageCache: false
  network: seedemu-b63-e1-214
  networkBridge: virbrb63e1
  networkCidr: 10.86.0.0/24
  networkGateway: 10.86.0.1
  dhcpStart: 10.86.0.10
  dhcpEnd: 10.86.0.99
  storageDir: /data/lxl/k8sTools/b63-e1-214
  diskDir: /data/lxl/k8sTools/b63-e1-214/disks
  cloudInitDir: /data/lxl/k8sTools/b63-e1-214/cloud-init
  baseImagePath: /data/lxl/k8sTools/base/jammy-server-cloudimg-amd64.img
  extraNetworks:
  - {name: seedemu-b63-e1-214-fabric0, bridge: brb63e1f0, model: virtio, trunk: trunk0, masterInterface: ens3}
  - {name: seedemu-b63-e1-214-fabric1, bridge: brb63e1f1, model: virtio, trunk: trunk1, masterInterface: ens4}
  allowExisting: false
fabric:
  type: macvlan-vlan
  mtu: 1400
  vlanTrunks:
  - {name: trunk0, masterInterface: ens3, vlanStart: 1, vlanEnd: 4094}
  - {name: trunk1, masterInterface: ens4, vlanStart: 1, vlanEnd: 4094}
cni: {cniType: macvlan, localLinkCniType: macvlan, attachedCniType: macvlan, defaultMasterInterface: ens3}
registry: {port: 5086}
seedemu:
  hostImageCacheDir: /home/lxl/k8s/largeScale/b62_k8s_scale/base_image/image-cache
  imageCacheDirs: [/home/lxl/k8s/largeScale/b62_k8s_scale/base_image/image-cache]
k3s:
  version: v1.29.15+k3s1
  clusterCidr: 10.100.0.0/16
  serviceCidr: 10.101.0.0/16
  flannelBackend: vxlan
  nodeCidrMaskSizeIpv4: 24
  maxPods: 240
  kubeletRegistryQps: 100
  kubeletRegistryBurst: 20
tuning: {userMaxNetNamespaces: 65536}
placement:
  excludeControlPlane: false
  algorithm: tradeoff-static
  selectedOnly: true
  injectResourceRequests: false
  fastGreedyScore: true
  externalCpuMillicores: 25
  resourceTargetUtilization: 0.70
  contentionKnee: 0.70
  placementSeed: 20260918
deploy:
  batchSize: 30
  batchSleepSeconds: 0
  subnetBatchSize: 50
  subnetBatchSleepSeconds: 0
  monitorInterval: 10
  monitorEnabled: false
  staticApplyMode: batch
  controllerApplyMode: batch
  warmupBatches: 4
  warmupBatchSize: 1
  postControllerApplySettleSeconds: 3
  pressureCheckSeconds: 3
  stabilizeTimeoutSeconds: 7200
  maxPendingPods: 80
  maxCreatingPods: 80
  maxCreatingPodsPerNode: 25
  maxNotReadyPods: 80
  maxFailedPods: 0
  requireAllNodesReady: true
  waitKubeOvnSubnets: false
study:
  phase: E1
  # Frozen before dynamic measurement. Values span locality to contention avoidance.
  variants:
  - {id: locality, algorithm: locality-only}
  - {id: tradeoff-0p1, algorithm: tradeoff-static, placement: {staticContentionWeight: 0.1}}
  - {id: tradeoff-10, algorithm: tradeoff-static, placement: {staticContentionWeight: 10}}
  - {id: tradeoff-1000, algorithm: tradeoff-static, placement: {staticContentionWeight: 1000}}
  - {id: capacity, algorithm: capacity-only}
  loadSweepCpuMillicores: [0, 10, 25, 50]
  calibrationLoadsMillicores: [0, 10, 25]
  holdoutLoadsMillicores: [50]
  loadSettleSeconds: 15
  loadApplyNodeConcurrency: 0
  loadApplyNodeTimeoutSeconds: 900
  hostSampleIntervalSeconds: 3
  dataplane:
    pairPlanVersion: 2
    pairSeed: 20260918
    pairsPerStratum: 10
    maxPairsTotal: 30
    pingCount: 5
    pingConcurrency: 8
    baselineTcpDirections: 12
    baselineTcpDuration: 4
    baselineTcpConcurrency: 4
    stressLevels: 4,8,16
    stressRepetitions: 2
    stressDuration: 6
    loadedPingCanaries: 6
    loadedPingCount: 6
