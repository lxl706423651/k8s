  topologyDir: /data/lxl/seed-emulator/topology
  canonicalOutputDir: /data/lxl/seed-emulator/topology/output_214_exportAll
  name: b63-e1b-214
  namespace: seedemu-b63-e1b-214
ssh: {user: ubuntu, key: /home/lxl/.ssh/id_ed25519}
defaults:
  masterName: b63-e1b-master
  workerNamePrefix: b63-e1b-worker
  ipPrefix: 10.92.0
  masterIpStart: 10
  workerIpStart: 11
  macPrefix: 52:54:00:63:92
  masterMacStart: 16
  workerMacStart: 17
master: {vcpus: 2, memoryGiB: 8, diskGb: 32}
workers: {count: 4, vcpus: 4, memoryGiB: 8, diskGb: 32}
kvm:
  prepareImageCache: false
  network: seedemu-b63-e1b-214
  networkBridge: virbrb63e1b
