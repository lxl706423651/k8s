  clusterCidr: 10.124.0.0/16
  serviceCidr: 10.125.0.0/16
  flannelBackend: vxlan
  nodeCidrMaskSizeIpv4: 24
  maxPods: 240
  kubeletRegistryQps: 100
  kubeletRegistryBurst: 40
tuning: {userMaxNetNamespaces: 65536}
placement:
