# Five-worker formal E1-A configuration. Each point still occupies one isolated
# 4-vCPU/8-GiB worker; barrier-synchronized waves run five points concurrently.
kind: kvm
clusterName: seedemu-b63-e1a-parallel

ssh:
  user: ubuntu
  key: ~/.ssh/id_ed25519

defaults:
  masterName: b63-e1ap-master
  workerNamePrefix: b63-e1ap-worker
  ipPrefix: 10.91.0
  masterIpStart: 10
  workerIpStart: 11
  macPrefix: 52:54:00:63:91
  masterMacStart: 16
  workerMacStart: 17

master: {vcpus: 2, memoryGiB: 8, diskGb: 32}
workers: {count: 5, vcpus: 4, memoryGiB: 8, diskGb: 32}

kvm:
  prepareImageCache: false
  network: seedemu-b63-e1a-parallel
  networkBridge: virbrb63e1p
  networkCidr: 10.91.0.0/24
  networkGateway: 10.91.0.1
  dhcpStart: 10.91.0.10
  dhcpEnd: 10.91.0.99
  storageDir: /data/lxl/k8sTools/b63-e1a-parallel
  diskDir: /data/lxl/k8sTools/b63-e1a-parallel/disks
  cloudInitDir: /data/lxl/k8sTools/b63-e1a-parallel/cloud-init
  baseImagePath: /data/lxl/k8sTools/base/jammy-server-cloudimg-amd64.img
  allowExisting: false

fabric: {type: none}
registry: {port: 5091}
k3s:
  version: v1.29.15+k3s1
  clusterCidr: 10.122.0.0/16
  serviceCidr: 10.123.0.0/16
  flannelBackend: vxlan
  nodeCidrMaskSizeIpv4: 24
  maxPods: 240
  kubeletRegistryQps: 100
  kubeletRegistryBurst: 40
tuning: {userMaxNetNamespaces: 65536}

e1a:
  namespacePrefix: seedemu-b63-e1ap
  phaseSeed: 20260918
  pilotReference:
    runDir: experiments/e1_marginal_pods/20260918_e1a
  workload:
    backgroundJobsPerSecond: 10
    backgroundTargetCpuMicroseconds: 5000
    backgroundDeadlineMicroseconds: 100000
    canaryJobsPerSecond: 100
    canaryTargetCpuMicroseconds: 200
    canaryDeadlineMicroseconds: 10000
    maxBacklogSeconds: 5
    cpuRequest: 10m
    memoryRequest: 16Mi
    # Frozen by the single-worker pilot; identical values are used on all VMs.
    backgroundWorkUnits: 1828943
    canaryWorkUnits: 36719
  pilot:
    warmupSeconds: 10
    measurementSeconds: 30
    pointStartLeadSeconds: 10
    pointReadyTimeoutSeconds: 600
    loadedN: [0, 20, 40, 60, 80, 100, 120, 140, 160, 180, 200]
    idleN: [0, 100, 200]
  formal:
    warmupSeconds: 30
    measurementSeconds: 120
    pointStartLeadSeconds: 10
    pointReadyTimeoutSeconds: 900
    repetitions: 5
    parallelism: 5
    coarseN: [0, 20, 40, 60, 80, 100, 120, 140, 160, 180, 200]
    fineRadiusPods: 10
    fineStepPods: 5
    randomSeed: 20260918
  measurement:
    nodeSampleIntervalSeconds: 1
    overloadOnTimeThreshold: 0.99
    relativeSlowdownReference: 0.20
  pinning:
    enabled: true
    masterPcpus: [340, 341]
    workerPcpuSets:
    - [342, 343, 344, 345]
    - [346, 347, 348, 349]
    - [350, 351, 352, 353]
    - [354, 355, 356, 357]
    - [358, 359, 360, 361]
  cleanup:
    destroyClusterAfterRun: true
