# B62 experiment assignment. Users edit this file to choose topology size,
# worker count, VM resources, and cluster addressing. Stage tuning parameters
# are fixed directly in the corresponding stage scripts.
experiment:
  name: b62-macvlan-vlan-4954
  topologySize: 4954
  workerCount: 5
  namespace: seedemu-b62-mvlan-vlan-4954
  sourceRoot: ../..
  topologyDir: ~/seed-emulator/topology

resources:
  totalVcpus: 300
  totalMemoryGiB: 600
  diskGb: 80
  master:
    vcpus: 48
    memoryGiB: 96
    diskGb: 80

kvm:
  clusterNamePrefix: seedemu-b62
  networkPrefix: seedemu-b62-net
  bridgePrefix: virbrb62
  networkCidr: 192.168.126.0/24
  networkGateway: 192.168.126.1
  dhcpStart: 192.168.126.2
  dhcpEnd: 192.168.126.254
  ipPrefix: 192.168.126
  master:
    namePrefix: seedemu-b62-master
    ipStart: 130
    macPrefix: "52:54:00:62:20"
    macStart: 130
  workers:
    namePrefix: seedemu-b62-worker
    ipStart: 131
    macPrefix: "52:54:00:62:20"
    macStart: 131
  ssh:
    user: ubuntu
    key: ~/.ssh/id_ed25519
  baseImagePath: base_image/jammy-server-cloudimg-amd64.img
  legacyBaseImagePath: base_image/jammy-server-cloudimg-amd64.img

k3s:
  version: v1.29.15+k3s1
  clusterCidr: 10.48.0.0/12
  serviceCidr: 10.43.0.0/16
  flannelBackend: host-gw
  nodeCidrMaskSizeIpv4: 20
  maxPods: 4000
  kubeletRegistryQps: 100
  kubeletRegistryBurst: 20

registry:
  port: 5000

seedemu:
  offline: false
  hostImageCacheDir: base_image/image-cache
  imageCacheDirs:
  - base_image/image-cache
  - /home/lxl/k8s/origin_k8s/setup/image-cache

ovn:
  helmCacheDir: base_image/helm
  iface: ens2
  northdThreads: 8
  controllerWorkerNum: 24
  controllerRequestCpu: 4000m
  controllerLimitCpu: "16"
  controllerRequestMemory: 2Gi
  controllerLimitMemory: 8Gi
  centralRequestCpu: 4000m
  centralLimitCpu: "24"
  centralRequestMemory: 4Gi
  centralLimitMemory: 16Gi
  ovsRequestCpu: 2000m
  ovsLimitCpu: "12"
  ovsRequestMemory: 4Gi
  ovsLimitMemory: 16Gi
  cniRequestCpu: 1000m
  cniLimitCpu: "6"
  cniRequestMemory: 1Gi
  cniLimitMemory: 4Gi
  cniOvsVsctlConcurrency: 1
  cniOvsVsctlTimeoutSeconds: 180
  interfaceReadyTimeoutSeconds: 0
  chartVersion: v1.16.2
  imageTag: v1.16.2-seed-ifskip
  vpcShards: 4

networking:
  backend: macvlan
  cniType: macvlan
  cniMasterInterface: ens2
  localLinkCniType: macvlan
  attachedCniType: macvlan
  macvlanVlanMode: true
  macvlanVlanIdStart: 1
  vlanTrunks:
  - name: trunk0
    masterInterface: ens2
    vlanStart: 1
    vlanEnd: 4094
  - name: trunk1
    masterInterface: ens3
    vlanStart: 1
    vlanEnd: 4094
    networkPrefix: seedemu-b62-fabric1
    bridgePrefix: virbrb62f1

placement:
  excludeControlPlane: false
  nodePodReserve: 20

deploy:
  batchSize: 80
  batchSleepSeconds: 0
  subnetBatchSize: 100
  subnetBatchSleepSeconds: 0
  monitorInterval: 20
  monitorEnabled: false
  staticApplyMode: batch
  controllerApplyMode: batch
  warmupBatches: 12
  warmupBatchSize: 1
  postControllerApplySettleSeconds: 5
  pressureCheckSeconds: 5
  stabilizeTimeoutSeconds: 36000
  maxPendingPods: 160
  maxCreatingPods: 160
  maxCreatingPodsPerNode: 40
  maxNotReadyPods: 160
  maxFailedPods: 10
  requireAllNodesReady: true
  waitKubeOvnSubnets: false
  kubeOvnSubnetTimeoutSeconds: 36000
  postSubnetCooldownSeconds: 0
  nodeStreamObserveTimeoutSeconds: 120
  nodeStreamMaxActivePerNode: 4
  skipKubeOvnGatewayCheck: false
